spring:
  application:
    name: Ecommerce Store API
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: root
    password: saroz123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: beans, health, info, metrics, shutdown,loggers, env
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true
  info:
    env:
      enabled: true


info:
  app:
    name: Ecommerce Store API
    description: A simple e-commerce store API built with Spring Boot
    version: 1.0.0

